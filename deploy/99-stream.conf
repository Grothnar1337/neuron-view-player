# UDP receive tuning for the RTP ingest.
#
# The source is 1080p60 H.264 over unicast UDP with no retransmission, so any
# packet the kernel drops because the socket buffer was full is a visible
# artefact. These raise the ceiling FFmpeg's -buffer_size 33554432 asks for.
#
# This mitigates loss, it does not eliminate it. If `RTP: missed N packets`
# is still excessive after this, the fix is the network path (wired, same
# VLAN as the source, VMXNET3 RX ring raised) — not more tuning here.
#
# Install to /etc/sysctl.d/99-stream.conf then: sudo sysctl --system

net.core.rmem_max = 134217728
net.core.rmem_default = 33554432
net.core.netdev_max_backlog = 5000
